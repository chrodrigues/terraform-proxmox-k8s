---
- name: Set hostname from inventory name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Configure /etc/hosts with all cluster nodes
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: "0644"

- name: Disable systemd-resolved (it would overwrite /etc/resolv.conf)
  ansible.builtin.systemd:
    name: systemd-resolved
    enabled: false
    state: stopped

- name: Configure /etc/resolv.conf
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"
    follow: false # replace the systemd-resolved stub symlink, not its target

- name: Set timezone
  ansible.builtin.command: "timedatectl set-timezone {{ timezone }}"
  changed_when: false

- name: Install base packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - net-tools
      - jq
      - python3-debian # required by the deb822_repository module
    state: present
    update_cache: true
