---
name: deploy-cluster

# Manual trigger with per-tier sizing. Leave a count EMPTY to keep the
# cluster's current size (read from the Terraform state on the runner).
# Scale-down note: drain and remove the node from Kubernetes yourself
# BEFORE lowering a count.
on:
  workflow_dispatch:
    inputs:
      control_plane_count:
        description: "Control plane nodes (masters tier). Empty = keep current"
        type: string
        required: false
        default: ""
      worker_count:
        description: "Worker nodes (workers tier). Empty = keep current"
        type: string
        required: false
        default: ""
      allow_replace:
        description: "Allow replacing existing VMs (DANGER: rebuilds them from scratch)"
        type: boolean
        required: false
        default: false

# Never let two deploys run at the same time
concurrency:
  group: cluster-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_proxmox_endpoint: ${{ vars.PROXMOX_ENDPOINT }}
      TF_VAR_proxmox_user_name: ${{ vars.PROXMOX_USER_NAME }}
      TF_VAR_proxmox_user_password: ${{ secrets.PROXMOX_USER_PASSWORD }}
      TF_VAR_proxmox_vm_user: ${{ vars.PROXMOX_VM_USER }}
      # The runner machine's own SSH key pair
      TF_VAR_ssh_public_key_file: "~/.ssh/id_rsa.pub"
      TF_VAR_ssh_private_key_file: "~/.ssh/id_rsa"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # State lives outside the workspace: checkout wipes untracked files,
      # and losing the state would orphan every VM Terraform manages.
      - name: Terraform init
        run: |
          mkdir -p "$HOME/.terraform-proxmox-k8s"
          terraform init -input=false -reconfigure \
            -backend-config="path=$HOME/.terraform-proxmox-k8s/terraform.tfstate"

      # Empty inputs mean "keep the current size": read it from the state
      # outputs. Falls back to the repo defaults on a first-ever deploy.
      - name: Resolve node counts
        run: |
          CP='${{ inputs.control_plane_count }}'
          WK='${{ inputs.worker_count }}'
          count() { terraform output -json "$1" 2>/dev/null \
            | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' 2>/dev/null; }
          [ -z "$CP" ] && CP=$(count control_plane_nodes) || true
          [ -z "$WK" ] && WK=$(count worker_nodes) || true
          CP="${CP:-1}"; WK="${WK:-3}"
          echo "Control planes: $CP | Workers: $WK"
          echo "TF_VAR_proxmox_number_of_vm_k8s_control_plane=$CP" >> "$GITHUB_ENV"
          echo "TF_VAR_proxmox_number_of_vm_k8s_worker_node=$WK" >> "$GITHUB_ENV"

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan | tee plan.txt

      # Replacing a VM destroys and rebuilds it. That must never happen as a
      # side effect (e.g. a changed cloud-init/SSH key) - only on purpose.
      - name: Guard against VM replacement
        if: ${{ inputs.allow_replace != true }}
        run: |
          if grep -q 'must be replaced' plan.txt; then
            echo "::error::Plan wants to REPLACE existing VMs (see plan above)."
            echo "::error::If this is intentional, re-run with allow_replace=true."
            exit 1
          fi
          echo "No replacements planned."

      - name: Terraform apply (create/scale the VMs)
        run: terraform apply -input=false tfplan

      - name: Bootstrap Kubernetes + Argo CD (Ansible)
        working-directory: ansible
        env:
          # Argo CD hand-over to chrodrigues/homelab-gitops (private): token with repo read + commit status.
          GITOPS_GITHUB_TOKEN: ${{ secrets.GITOPS_GITHUB_TOKEN }}
          ONEPASSWORD_SA_TOKEN: ${{ secrets.ONEPASSWORD_SA_TOKEN }}
        run: |
          ansible-playbook site.yml \
            -e "gitops_github_token=${GITOPS_GITHUB_TOKEN}" \
            -e "onepassword_sa_token=${ONEPASSWORD_SA_TOKEN}"

      - name: Cluster status
        working-directory: ansible
        run: |
          ansible 'control_plane[0]' --become -m ansible.builtin.command \
            -a "kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes -o wide"
